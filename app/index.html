<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>My Launcher</title>
<meta name="viewport" content="width=1920, height=1080">
<style>
:root{--bg:#14161b;--ink:#f3efe6;--dim:#8d93a0}
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--ink);
 font-family:"SamsungOne","Segoe UI",Roboto,Arial,sans-serif}
body{background:radial-gradient(1200px 700px at 15% 0%,#232836 0%,var(--bg) 70%)}
header{position:absolute;left:120px;top:100px}
#time{font-size:150px;font-weight:200;letter-spacing:-4px;line-height:1}
#date{font-size:36px;color:var(--dim);margin-top:14px}
#row{position:absolute;left:120px;right:0;top:600px;height:360px;display:flex;align-items:center;gap:36px}
.tile{flex:0 0 260px;height:260px;border-radius:28px;display:flex;align-items:flex-end;
 padding:28px;font-size:34px;font-weight:600;color:#fff;transition:transform .18s,flex-basis .18s,box-shadow .18s;
 opacity:.72}
.tile.on{flex-basis:430px;height:340px;opacity:1;transform:translateY(-6px);
 box-shadow:0 0 0 6px var(--ink),0 30px 60px rgba(0,0,0,.55)}
#hint{position:absolute;left:120px;bottom:50px;font-size:26px;color:var(--dim)}
#msg{position:absolute;right:120px;bottom:50px;font-size:26px;color:#ff9b73}
</style></head><body>
<header><div id="time"></div><div id="date"></div></header>
<div id="row"></div>
<div id="hint">Left / Right to move, OK to open, Back to exit</div>
<div id="msg"></div>
<script>
// Edit this list: name, Samsung app ID, tile colour.
var APPS=[
 {n:"YouTube",id:"111299001912",c:"#c4302b"},
 {n:"Netflix",id:"3201907018807",c:"#b20710"},
 {n:"Prime Video",id:"3201910019365",c:"#0f79af"},
 {n:"Disney+",id:"3201901017640",c:"#1b3a8c"},
 {n:"Spotify",id:"3201606009684",c:"#1a9c4a"},
 {n:"Plex",id:"3201512006963",c:"#8a6a10"}
];
var row=document.getElementById("row"),msg=document.getElementById("msg"),sel=0,tiles=[];
APPS.forEach(function(a,i){var d=document.createElement("div");d.className="tile";
 d.style.background="linear-gradient(145deg,"+a.c+",#101218)";d.textContent=a.n;row.appendChild(d);tiles.push(d)});
function focus(i){sel=(i+APPS.length)%APPS.length;tiles.forEach(function(t,k){t.classList.toggle("on",k===sel)});msg.textContent=""}
function launch(){var a=APPS[sel];
 try{tizen.application.launch(a.id,function(){},function(e){msg.textContent=a.n+" could not open ("+e.message+")"})}
 catch(e){msg.textContent="Launch not available here: "+a.n}}
document.addEventListener("keydown",function(e){var k=e.keyCode;
 if(k===37)focus(sel-1);else if(k===39)focus(sel+1);else if(k===13)launch();
 else if(k===10009){try{tizen.application.getCurrentApplication().exit()}catch(x){}}});
try{tizen.tvinputdevice.registerKey("MediaPlayPause")}catch(e){}
function tick(){var d=new Date();
 document.getElementById("time").textContent=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
 document.getElementById("date").textContent=d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})}
tick();setInterval(tick,15000);focus(0);
</script></body></html>
